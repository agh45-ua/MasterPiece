name: Build and Package Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-deb:
    name: Build .deb package (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper dh-make \
            cmake g++ libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libasound2-dev

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: ../masterpiece_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-zip:
    name: Build ZIP package (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # por si raylib está como submódulo

      - name: Clean build directory
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          New-Item -ItemType Directory -Path build | Out-Null

      - name: Configure CMake (use Raylib from repo)
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package with CPack
        shell: pwsh
        run: |
          cd build
          cpack -C Release

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

