name: Build and Package Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-deb:
    name: Build .deb package (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper cmake g++ \
            libgl-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxxf86vm-dev libasound2-dev

      - name: Build Debian package
        run: make dist

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: ../masterpiece_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-zip:
    name: Build ZIP package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package with CPack
        run: |
          cd build
          cpack
      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}