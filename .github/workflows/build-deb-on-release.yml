name: Build .deb on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Instalamos EXACTAMENTE los nombres que el proceso de empaquetado te pide en el log
          sudo apt-get install -y \
            build-essential dpkg-dev debhelper cmake \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxxf86vm-dev libasound2-dev

      - name: Build .deb package
        run: |
          make dist
          ls -la ..

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}